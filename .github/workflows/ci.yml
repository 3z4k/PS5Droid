name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Format and documentation hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==23.1.3
      - run: git ls-files '*.cpp' '*.h' '*.c' | xargs clang-format --dry-run --Werror
      - run: python3 tools/check_docs.py
  host:
    name: Host (${{ matrix.compiler }}, ${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, sanitizer: none}
          - {compiler: clang, sanitizer: none}
          - {compiler: clang, sanitizer: "address,undefined"}
          - {compiler: clang, sanitizer: thread}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang lld zlib1g-dev
      - name: Configure
        shell: bash
        run: |
          if [ '${{ matrix.compiler }}' = clang ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -B build -G Ninja -DPS5DROID_SANITIZERS='${{ matrix.sanitizer }}'
      - name: Build and test
        run: |
          cmake --build build 2>&1 | tee build.log
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      - name: CLI and native ELF smoke tests
        if: matrix.sanitizer == 'none'
        run: |
          python3 tools/build_elf_fixture.py --output build/fixtures/cooperative.elf
          ./build/ps5droid-host --run-cooperative-elf build/fixtures/cooperative.elf | tee elf.log
          ./build/ps5droid-host --matrix | tee matrix.log
          ./build/ps5droid-host --start-attempt | tee blockers.log
          ./build/ps5droid-host --report-json build/host-evidence.json --probe-exec
          ./build/ps5droid-host --inspect-apk tests/fixtures/aapt2-manifest.apk > build/apk.json
          python3 tools/check_reports.py build/host-evidence.json build/apk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.compiler }}-${{ matrix.sanitizer }}
          path: |
            *.log
            build/*evidence.json
            build/apk.json
  macos:
    name: macOS portability
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure
  fuzz:
    name: Bounded parser fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld cmake ninja-build zlib1g-dev
      - run: CC=clang CXX=clang++ cmake -B build -G Ninja -DPS5DROID_BUILD_FUZZER=ON
      - run: cmake --build build --target ps5droid_fuzz
      - name: Seeded fuzz smoke
        run: |
          mkdir -p build/corpus
          python3 tools/build_elf_fixture.py --output build/corpus/cooperative.elf
          cp tests/fixtures/image-manifest.txt build/corpus/image-manifest.txt
          ./build/ps5droid_fuzz build/corpus -runs=10000 -max_len=65536
  ps5:
    name: PS5 cross-build (hardware execution unverified)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18-dev cmake ninja-build curl unzip
      - name: Install checksum-verified SDK
        run: |
          url=$(python3 -c 'import json; print(json.load(open(".github/ps5-sdk.json"))["url"])')
          sha=$(python3 -c 'import json; print(json.load(open(".github/ps5-sdk.json"))["sha256"])')
          curl --fail --location --retry 3 "$url" -o sdk.zip
          echo "$sha  sdk.zip" | sha256sum --check --strict
          sudo unzip -q -d /opt sdk.zip
          echo 'PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk' >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          sdk_version=$(python3 -c 'import json; print(json.load(open(".github/ps5-sdk.json"))["version"])')
          cmake -B build-ps5 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PS5_PAYLOAD_SDK/toolchain/prospero.cmake" \
            -DPS5DROID_BUILD_PS5=ON -DPS5DROID_SDK_VERSION="$sdk_version" 2>&1 | tee configure-ps5.log
          cmake --build build-ps5 --target ps5droid 2>&1 | tee build-ps5.log
          test -s build-ps5/ps5droid.elf
          sha256sum build-ps5/ps5droid.elf > build-ps5/ps5droid.elf.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps5-elf-experimental
          path: |
            build-ps5/ps5droid.elf
            build-ps5/ps5droid.elf.sha256
            *-ps5.log
            .github/ps5-sdk.json
